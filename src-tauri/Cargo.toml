# `host` is the detached file server; see host/Cargo.toml for why it is a
# separate package rather than a second binary here.
[workspace]
members = ["host"]

[package]
name = "lantern"
version = "1.0.0"
description = "LANTern — your local network, illuminated."
authors = ["LANTern"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "set-header"] }

mdns-sd = "0.11"
notify = "6"
if-addrs = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# Downloading an update. GitHub serves release assets without any
# `Access-Control-Allow-Origin` header, so a webview `fetch` is refused
# as cross-origin however the CSP is written — the download has to be
# made natively. The plugin's scope, in capabilities/default.json,
# limits it to the GitHub release hosts and nothing else.
tauri-plugin-http = "2"
# Downloading an update. Pinned to the version tauri-plugin-http already
# brings, so this adds a dependency and not a second copy of a TLS stack.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
sha2 = "0.10"
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2"
async-stream = "0.3.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Launching the app twice used to give a second process that silently failed to
# bind the ports and showed an empty peer list for ever. This focuses the
# window that is already running instead.
tauri-plugin-single-instance = "2"


[features]
# Used by the Tauri CLI when producing a release bundle.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Moving the pointer and pressing keys on this machine, for a phone acting as
# a trackpad or a controller.
#
# Windows only. Not because the crate is unavailable elsewhere, but because on
# macOS its handle holds a CGEventSource that is not Send, so it cannot sit in
# the shared state every other part of this application lives in. Making it
# work there means keeping it on one thread and posting to it, which is real
# work for a platform this feature does not yet claim to support - and the
# window already says so rather than offering a control that does nothing.
[target.'cfg(windows)'.dependencies]
enigo = "0.2"

# Taking a picture of this screen, for a phone that is driving it.
#
# Not WebRTC, which is what the calls use. Screen sharing there goes through
# getDisplayMedia, and that opens the operating system's own "which window?"
# picker - which needs somebody standing at the machine to answer it, and the
# entire point of remote control is that nobody is. The grant this device
# already gave is the consent; asking twice, in a dialog only the absent
# person can see, is asking nobody.
xcap = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
